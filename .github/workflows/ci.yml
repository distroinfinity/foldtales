name: CI

# Every branch and PR head arrives as a push, so this one trigger covers both without running twice.
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

# Deploys aren't done here: Cloudflare Pages and Railway are linked to this repo and build main
# themselves on every push (owner, Nov 15). Railway waits for this check to pass first.
