name: CI

# Every branch and PR head arrives as a push, so this one trigger covers both without running twice.
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Deploys happen only from main (owner, Nov 15: no per-branch previews). Off until BACKEND_URL is set.
  deploy-client:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabletop/client build
        env:
          TT_PUBLIC_BACKEND_URL: ${{ vars.BACKEND_URL }}
          TT_PUBLIC_BUILD_ID: ${{ github.sha }}
          # Switches for the live site, set as GitHub variables (unset: sign-in off, the AI Storyteller on).
          TT_PUBLIC_ACCOUNTS: ${{ vars.TT_PUBLIC_ACCOUNTS }}
          TT_PUBLIC_STORYTELLER: ${{ vars.TT_PUBLIC_STORYTELLER }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 pages deploy client/dist --project-name="${{ vars.PAGES_PROJECT }}" --branch=main

  deploy-backend:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @railway/cli@4 up --service backend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
