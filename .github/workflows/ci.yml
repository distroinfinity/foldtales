name: CI

# Runs on main only (owner, Nov 16: Actions minutes). Lanes run `pnpm check` locally before every
# push and before opening a PR. Railway waits for this check on main before deploying the backend.
on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

# Deploys aren't done here: Cloudflare Pages and Railway are linked to this repo and build main
# themselves on every push (owner, Nov 15).
