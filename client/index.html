<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151c2e" />
    <link rel="icon" href="data:," />
    <title>Tabletop Theater</title>
  </head>
  <body>
    <main id="landing" class="landing" data-state="loading">
      <div class="book" aria-hidden="true">
        <div class="cover">
          <img class="cloth" src="./art/book/cover-front.png" alt="" />
          <p class="title">The Lighthouse at the Edge of the Table</p>
        </div>
        <div class="pages"></div>
      </div>
      <h1 class="sr-only">The Lighthouse at the Edge of the Table</h1>
      <button id="open" class="open" type="button" disabled>
        <span class="open-label">Getting the book ready</span>
        <span class="open-progress" aria-hidden="true"></span>
      </button>
      <p class="hint">Sit at a table, and look down at it once you’re in.</p>
      <button id="room" class="room" type="button" hidden>No table nearby? Read in the painted room.</button>
      <p class="voice">
        <span class="voice-text">Characters can hear you when you pinch them and speak. Your voice goes to a cloud service to be understood, and isn’t kept.</span>
        <button id="mic" class="mic" type="button">Let them hear you</button>
      </p>
    </main>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
