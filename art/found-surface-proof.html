<!doctype html>
<!-- The found-surface moment, "ember and wash": searching, found, the book settling, then house lights down.
     Reference only, not product code, and CSS 3D plus a 2D canvas rather than IWSDK. The wash is drawn the
     way the stage's shader will draw it: a noisy-edged bloom, pigment pooling at its rim, paper grain, a
     gold pencil line. Serve art/ with any static server, then open /found-surface-proof.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found Surface Proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500&family=Fraunces:opsz,wght@144,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: hidden; background: #3a332d; color: #f6efe2; font-family: 'Atkinson Hyperlegible Next', sans-serif; }
  /* Stand-in for your real room: a lit wall and a wooden table. The dim covers it, never the stage. */
  .room { position: fixed; inset: 0; background: linear-gradient(#cfc6b8 0 38%, #8c7a66 38% 100%); }
  .view { position: fixed; inset: 0; perspective: 900px; perspective-origin: 50% 0%; }
  .table { position: absolute; left: 50%; top: 60%; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(56deg) scale(.82); }
  .wood { position: absolute; left: -520px; top: -360px; width: 1040px; height: 620px; border-radius: 10px; background: repeating-linear-gradient(92deg, #9b7653 0 18px, #a27c58 18px 31px, #94704e 31px 47px); box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  canvas.wash { position: absolute; left: -330px; top: -300px; width: 660px; height: 600px; }
  .book { position: absolute; left: 0; top: -130px; width: 168px; height: 252px; transform-style: preserve-3d; opacity: 0; }
  .book .cover { position: absolute; inset: 0; background: url(book/cover-front.png) center / 100% 100%; border-radius: 2px 5px 5px 2px; transform: translateZ(24px); }
  .book .title { position: absolute; left: 15%; right: 13%; top: 9.5%; height: 15%; margin: 0; display: grid; place-items: center; text-align: center; font: 500 10.5px/1.05 'Fraunces', serif; font-variation-settings: 'opsz' 144; color: #1f2a44; transform: translateZ(24.5px); }
  .book .block { position: absolute; inset: 2px 2px 2px 0; background: #efe4cf; transform: translateZ(12px); }
  .book .shadow { position: absolute; inset: -18px -26px -26px -14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(10,8,12,.55), rgba(10,8,12,0) 70%); }
  .ember { position: fixed; left: 50%; top: 30%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff6dc 0 6%, rgba(255,206,120,.9) 14%, rgba(255,176,84,.28) 40%, rgba(255,160,70,0) 70%); filter: blur(.3px); }
  .dim { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 34% 30% at 50% 62%, rgba(26,18,8,.06), rgba(8,10,26,.68) 100%); }
  .note { position: fixed; left: 16px; top: 14px; max-width: 44ch; font-size: 15px; line-height: 1.45; color: #2b2420; background: rgba(246,239,226,.86); padding: 8px 12px; border-radius: 6px; }
  .controls { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 16px; }
  .controls button { font: inherit; font-size: 15px; padding: 9px 15px; border-radius: 7px; border: 1px solid #f6efe244; background: #f6efe2; color: #2b2420; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: #1f2a44; color: #f6efe2; }
</style>
</head>
<body>
<div class="room"></div>
<div class="view"><div class="table" id="table">
  <div class="wood"></div>
  <canvas class="wash" id="wash" width="660" height="600"></canvas>
  <div class="book" id="book"><div class="shadow"></div><div class="block"></div><div class="cover"></div><p class="title">The Lighthouse at the Edge of the Table</p></div>
</div></div>
<div class="ember" id="ember"></div>
<div class="dim" id="dim"></div>
<p class="note" id="note">Searching: the ember sinks toward the table and your eyes follow it.</p>
<div class="controls">
  <button id="replay">Replay</button>
  <button id="found" aria-pressed="true">A table is found</button>
  <button id="none" aria-pressed="false">Nothing found in 5 s</button>
</div>
<script>
(function () {
  const canvas = document.getElementById('wash');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, CX = W / 2, CY = H / 2 + 40;
  const ember = document.getElementById('ember'), book = document.getElementById('book'), dim = document.getElementById('dim'), note = document.getElementById('note');
  const q = new URLSearchParams(location.search);
  // ?at=<seconds> holds one moment still, for checking stills. ?none shows the nothing-found path.
  const held = q.has('at') ? Number(q.get('at')) : null;
  let found = !q.has('none'), start = performance.now();

  // Paper grain: fixed noise, so the wash reads as pigment on paper laid on your table.
  const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
  const g = grain.getContext('2d'), img = g.createImageData(W, H);
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < img.data.length; i += 4) { const v = 200 + rnd() * 55; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);

  // A wobbling, organic edge: the bloom's radius at an angle.
  const edge = (a, r, t) => r * (1 + 0.06 * Math.sin(a * 3 + 1.3) + 0.04 * Math.sin(a * 7 + t * 0.6) + 0.025 * Math.sin(a * 13 + 2.1));
  const path = (r, t, squash) => { ctx.beginPath(); for (let i = 0; i <= 96; i++) { const a = (i / 96) * Math.PI * 2, rr = edge(a, r, t); const x = CX + Math.cos(a) * rr, y = CY + Math.sin(a) * rr * squash; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); };

  function drawWash(bloom, fade, words, t) {
    ctx.clearRect(0, 0, W, H);
    if (bloom <= 0) return;
    const r = 250 * bloom, squash = 0.82;
    ctx.save();
    ctx.globalAlpha = fade;
    // Body: page-coloured pigment, lighter in the middle, pooling darker and warmer at the rim.
    path(r, t, squash);
    const body = ctx.createRadialGradient(CX, CY, r * 0.1, CX, CY, r);
    body.addColorStop(0, 'rgba(246,239,226,.80)');
    body.addColorStop(0.75, 'rgba(240,226,200,.78)');
    body.addColorStop(0.93, 'rgba(214,180,120,.85)');
    body.addColorStop(1, 'rgba(190,150,90,.9)');
    ctx.fillStyle = body; ctx.fill();
    ctx.save(); ctx.clip(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.5 * fade; ctx.drawImage(grain, 0, 0); ctx.restore();
    // The gold pencil line, just inside the rim, slightly broken like a hand-drawn line.
    ctx.setLineDash([22, 3, 40, 2]); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(178,128,40,.85)';
    path(r * 0.965, t + 0.4, squash); ctx.stroke();
    ctx.restore();
    if (words > 0) {
      ctx.save();
      ctx.globalAlpha = words * fade;
      ctx.fillStyle = '#2b2420';
      ctx.font = '500 26px "Atkinson Hyperlegible Next", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Your theater will play here', CX, CY + r * squash * 0.62);
      ctx.restore();
    }
  }

  const clamp = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (v) => 1 - Math.pow(1 - v, 3);
  function frame(now) {
    const t = held !== null ? held : (now - start) / 1000;
    // 0-2.6 s searching (or 5 s with nothing found), then the ember lands.
    const land = found ? 2.6 : 5;
    const s = clamp(t / land);
    const y = 30 + 26 * easeOut(s) + Math.sin(t * 2.3) * 1.2 * (1 - s);
    const x = 50 + Math.sin(t * 1.4) * 4 * (1 - s);
    ember.style.top = y + '%'; ember.style.left = x + '%';
    ember.style.opacity = t < land ? 1 : Math.max(0, 1 - (t - land) / 0.35);
    ember.style.transform = `scale(${1 - 0.35 * s + 0.06 * Math.sin(t * 9)})`;
    const b = clamp((t - land) / 1.1);
    const words = found ? clamp((t - land - 0.5) / 0.6) : 0;
    const settle = clamp((t - land - 1.2) / 0.38);
    const dimOn = clamp((t - land - 1.9) / 2);
    const stain = 1 - 0.75 * dimOn;
    drawWash(easeOut(b), stain, words * (1 - dimOn), t);
    book.style.opacity = settle > 0 ? 1 : 0;
    book.style.transform = `translate(-10px, 0) translateZ(${(1 - settle * settle) * 70}px)`;
    dim.style.opacity = dimOn;
    note.textContent = t < land ? (found ? 'Searching: the ember sinks toward the table and your eyes follow it.' : 'Searching, and nothing is found.')
      : settle < 1 ? (found ? 'Found: the wash blooms across your table, with the line printed in it.' : 'Nothing found: a quieter wash where you are looking, no words, so nothing claims a table that isn\'t there.')
      : 'The book settles with its shadow and a thump, then the house lights go down and the wash fades to a stain.';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const set = (f) => { found = f; start = performance.now(); document.getElementById('found').setAttribute('aria-pressed', String(f)); document.getElementById('none').setAttribute('aria-pressed', String(!f)); };
  document.getElementById('replay').onclick = () => (start = performance.now());
  document.getElementById('found').onclick = () => set(true);
  document.getElementById('none').onclick = () => set(false);
})();
</script>
</body>
</html>
