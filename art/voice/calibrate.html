<!doctype html>
<meta charset="utf-8" />
<title>Chain calibration</title>
<script type="module">
  // Renders clips through each setting and reports the outputDb that matches Dry, capped by the peak ceiling.
  const CEILING = -1;
  const toDb = (x) => 20 * Math.log10(Math.max(x, 1e-12));

  function stats(channel) {
    let energy = 0;
    let peak = 0;
    for (let i = 0; i < channel.length; i += 1) {
      energy += channel[i] * channel[i];
      peak = Math.max(peak, Math.abs(channel[i]));
    }
    return { energy, count: channel.length, peak };
  }

  async function render(buffer, build) {
    const ctx = new OfflineAudioContext(1, buffer.length, buffer.sampleRate);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const { input, output } = build(ctx);
    source.connect(input);
    output.connect(ctx.destination);
    source.start();
    return (await ctx.startRendering()).getChannelData(0);
  }

  const dry = (trimDb) => (ctx) => {
    const g = ctx.createGain();
    g.gain.value = 10 ** (trimDb / 20);
    return { input: g, output: g };
  };

  async function measure(buffers, buildFor) {
    let energy = 0;
    let count = 0;
    let peak = 0;
    for (const { buffer, trimDb } of buffers) {
      const s = stats(await render(buffer, buildFor(trimDb)));
      energy += s.energy;
      count += s.count;
      peak = Math.max(peak, s.peak);
    }
    return { rmsDb: toDb(Math.sqrt(energy / count)), peakDb: toDb(peak) };
  }

  try {
    const { createVoiceChain } = await import("./chain.mjs");
    const { clips, chainJson } = await (await fetch("/job")).json();
    const context = new OfflineAudioContext(1, 1, 48000);
    const buffers = [];
    for (const clip of clips) {
      const bytes = await (await fetch(clip.url)).arrayBuffer();
      buffers.push({ buffer: await context.decodeAudioData(bytes), trimDb: clip.trimDb });
    }
    const dryLevel = await measure(buffers, dry);
    const settings = {};
    for (const [name, base] of Object.entries(chainJson.settings)) {
      const at = (outputDb) => measure(buffers, (trimDb) => (ctx) => createVoiceChain(ctx, { ...base, outputDb }, { trimDb }));
      const unity = await at(0);
      let outputDb = dryLevel.rmsDb - unity.rmsDb;
      let peakLimited = false;
      if (unity.peakDb + outputDb > CEILING) {
        outputDb = CEILING - unity.peakDb;
        peakLimited = true;
      }
      outputDb = Math.round(outputDb * 10) / 10;
      const check = await at(outputDb);
      settings[name] = { outputDb, rmsDeltaDb: check.rmsDb - dryLevel.rmsDb, peakDb: check.peakDb, peakLimited };
    }
    await fetch("/__result", { method: "POST", body: JSON.stringify({ settings, dry: dryLevel }) });
  } catch (e) {
    await fetch("/__result", { method: "POST", body: JSON.stringify({ error: String(e) }) });
  }
</script>
